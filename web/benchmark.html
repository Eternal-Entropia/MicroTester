<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MicroTester - WebUSB Benchmark</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body { padding: 20px; font-family: monospace; background: #1a1a1a; color: #fff; }
        .card { max-width: 600px; margin: 0 auto; background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        button { padding: 10px 20px; cursor: pointer; background: #4CAF50; border: none; color: white; border-radius: 4px; font-weight: bold; margin-right: 10px; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.stop { background: #f44336; }
        .log { background: #000; padding: 10px; height: 300px; overflow-y: auto; margin-top: 20px; border-radius: 4px; border: 1px solid #444; }
        h1 { margin-top: 0; }
        .val { color: #4CAF50; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>WebUSB Benchmark</h1>
        <p style="color:#aaa;">This tool measures the raw USB throughput from the MicroTester board to the browser.</p>
        <div style="margin-bottom: 20px;">
            <button id="btnConnect">1. Connect WebUSB</button>
            <button id="btnStart" disabled>2. Start Benchmark</button>
            <button id="btnStop" class="stop" disabled>Stop</button>
        </div>
        
        <div style="background: #111; padding: 15px; border-radius: 4px; margin-bottom: 20px;">
            <h3 style="margin-top:0;">Speed: <span class="val" id="speedValue">0.00</span> KB/s</h3>
            <p style="margin-bottom:0; color:#aaa;">Total Bytes Received: <span class="val" id="totalBytes" style="color:#fff;">0</span></p>
        </div>
        
        <div class="log" id="logBox"></div>
    </div>

    <script src="js/usb_protocol.js"></script>
    <script>
        window.addEventListener('load', () => {
            const btnConnect = document.getElementById('btnConnect');
            const btnStart = document.getElementById('btnStart');
            const btnStop = document.getElementById('btnStop');
            const speedValue = document.getElementById('speedValue');
            const totalBytesEl = document.getElementById('totalBytes');
            const logBox = document.getElementById('logBox');
            
            let benchmarking = false;
            let totalBytes = 0;
            let startTime = 0;
            let lastReportTime = 0;
            let lastReportBytes = 0;
            let timer = null;

            function log(msg) {
                logBox.innerHTML += `<div><span style="color:#666">[${new Date().toISOString().split('T')[1].slice(0,8)}]</span> ${msg}</div>`;
                logBox.scrollTop = logBox.scrollHeight;
            }

            // The click listener is already added by usb_protocol.js if btnConnect exists.
            // We just need to override the callbacks.
            
            microTester.onConnect = () => {
                btnConnect.innerText = "Disconnect";
                btnStart.disabled = false;
                log(microTester.device.isMock ? "Connected to MOCK device." : "Connected to REAL device.");
            };

            microTester.onDisconnect = () => {
                btnConnect.innerText = "1. Connect WebUSB";
                btnStart.disabled = true;
                btnStop.disabled = true;
                benchmarking = false;
                log("Disconnected.");
                clearInterval(timer);
            };

            microTester.onData = (data) => {
                if (!benchmarking) return;
                totalBytes += data.length;
            };

            btnStart.addEventListener('click', () => {
                if(!microTester.device) return;
                log("Starting benchmark stream...");
                benchmarking = true;
                totalBytes = 0;
                startTime = performance.now();
                lastReportTime = startTime;
                lastReportBytes = 0;
                
                btnStart.disabled = true;
                btnStop.disabled = false;
                
                // Send CMD_BENCHMARK_START (0x20)
                microTester.sendCommand(0x20);
                
                timer = setInterval(() => {
                    const now = performance.now();
                    const deltaMs = now - lastReportTime;
                    if (deltaMs >= 1000) {
                        const bytesSinceLast = totalBytes - lastReportBytes;
                        const speedKbps = (bytesSinceLast / 1024) / (deltaMs / 1000);
                        
                        speedValue.innerText = speedKbps.toFixed(2);
                        totalBytesEl.innerText = totalBytes.toLocaleString();
                        
                        log(`Throughput: ${speedKbps.toFixed(2)} KB/s`);
                        
                        lastReportTime = now;
                        lastReportBytes = totalBytes;
                    }
                }, 1000);
            });

            btnStop.addEventListener('click', () => {
                log("Stopping benchmark stream...");
                benchmarking = false;
                clearInterval(timer);
                btnStart.disabled = false;
                btnStop.disabled = true;
                
                // Send CMD_BENCHMARK_STOP (0x21)
                microTester.sendCommand(0x21);
                
                const totalSecs = (performance.now() - startTime) / 1000;
                const avgSpeed = (totalBytes / 1024) / totalSecs;
                log(`Benchmark ended. Avg Speed: <strong style="color:#4CAF50">${avgSpeed.toFixed(2)} KB/s</strong> over ${totalSecs.toFixed(1)}s`);
            });
        });
    </script>
</body>
</html>
