    <text x="675" y="120" fill="#f8fafc" font-size="11">• CH2: Input = PA2, Bias = PB8</text>
    <text x="675" y="140" fill="#f8fafc" font-size="11">• CH3: Input = PA3, Bias = PB7</text>
    <text x="675" y="160" fill="#f8fafc" font-size="11">• CH4: Input = PA4, Bias = PB6</text>
    <text x="675" y="180" fill="#94a3b8" font-size="10">(Build this exact circuit for each channel you need)</text>
   </g>
  </g>
